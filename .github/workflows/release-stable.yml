name: Release Stable

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

permissions:
  contents: read

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '24'

      - name: Validate channel, tag, lock and repository
        env:
          RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/ci/validate-release.cjs stable

  sync-readme:
    permissions:
      contents: write
    needs: validate
    uses: ./.github/workflows/sync-readme.yml

  release:
    permissions:
      contents: write
    needs: sync-readme
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Install development dependencies
        run: npm ci
      - name: Sync release README before build
        run: node scripts/ci/sync-readme-repository.cjs
      - name: Bake release repository metadata
        run: node scripts/ci/validate-release.cjs stable --prepare
      - name: Check and test
        run: |
          npm run typecheck
          npm run typecheck:desktop
          npm run build
          npm test
          node --test test/release/*.test.cjs
      - name: Build and sign DMG/ZIP without publishing
        env:
          SCVN_TABS: fork,git,init,settings
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SCVN_SELFSIGN_P12: ${{ secrets.SCVN_SELFSIGN_P12 }}
          SCVN_SELFSIGN_PASSWORD: ${{ secrets.SCVN_SELFSIGN_PASSWORD }}
        run: bash scripts/ci/build-sign.sh stable

      - name: Publish verified release
        run: node scripts/ci/publish-release.cjs stable
