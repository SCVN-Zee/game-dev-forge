# STABLE release. A `v<version>` tag (e.g. v0.5.0) builds the macOS app and
# publishes only the DMG and full updater ZIP to GitHub Releases.
#
# Signing is tiered (shared script build-sign-publish.sh), best available first:
#   1. Apple Developer ID + notarization (CSC_LINK) — opens normally.
#   2. Self-signed cert (SCVN_SELFSIGN_P12) — right-click→Open on first run.
#   3. Ad-hoc fallback (no secrets) — right-click→Open on first run.
#
# Release routing follows tags, not branch pushes:
#   - v<version> release (no prerelease id)  → this workflow      (stable)
#   - v<version> with a prerelease id (v*-*) → release-beta.yml   (beta)
# The `!v*-*` line below keeps semver prerelease tags off this workflow —
# without it, `v*` would also match `v0.6.0-beta.1` and double-fire.
#
# Optional repository secrets:
#   Tier 1 (Apple Developer ID + notarization):
#     CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Tier 2 (self-signed; generate via .github/scripts/gen-selfsign-cert.sh):
#     SCVN_SELFSIGN_P12 (base64 .p12), SCVN_SELFSIGN_PASSWORD
# GITHUB_TOKEN (auto) publishes the release; contents:write is granted below.

name: release-stable

on:
  push:
    tags:
      - "v*"
      - "!v*-*" # exclude semver prerelease tags (handled by release-beta.yml)

# Supersede in-flight runs for the same tag.
concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64), matches the shipped target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ($pkg). Bump the version to match the tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run typecheck
          npm run typecheck:desktop
          npm run build
          npm test

      # Build in no-publish mode: --publish uploads ZIP blockmaps independently
      # of publishAutoUpdate, so only the script's explicit DMG/ZIP upload is safe.
      - name: Prepare unpublished draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/tmp/release-is-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-is-draft)" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; refusing to replace assets"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated release $GITHUB_REF_NAME."
          fi
      - name: Build, sign, and upload DMG/ZIP
        env:
          SCVN_TABS: fork,git,init,settings
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SCVN_SELFSIGN_P12: ${{ secrets.SCVN_SELFSIGN_P12 }}
          SCVN_SELFSIGN_PASSWORD: ${{ secrets.SCVN_SELFSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-sign-publish.sh stable

      - name: Verify release asset allowlist and publish stable latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' "game-dev-forge-$(node -p "require('./package.json').version")-arm64.dmg" "game-dev-forge-$(node -p "require('./package.json').version")-arm64.zip" | sort)"
          if [ "$assets" != "$expected" ]; then
            echo "::error::release contains files outside the DMG/ZIP allowlist"
            printf 'Expected:\n%s\nFound:\n%s\n' "$expected" "$assets"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
