# STABLE release. A `v<version>` tag (e.g. v0.5.0) builds the macOS app and
# publishes the dmg to GitHub Releases for manual installation.
#
# Signing is tiered (shared script build-sign-publish.sh), best available first:
#   1. Apple Developer ID + notarization (CSC_LINK) — opens normally.
#   2. Self-signed cert (SCVN_SELFSIGN_P12) — right-click→Open on first run.
#   3. Ad-hoc fallback (no secrets) — right-click→Open on first run.
#
# Env split by tag, NOT by branch push (nothing runs on push to dev/main):
#   - v<version> release (no prerelease id)  → this workflow      (stable)
#   - v<version> with a prerelease id (v*-*) → release-beta.yml   (beta)
# The `!v*-*` line below keeps semver prerelease tags off this workflow —
# without it, `v*` would also match `v0.6.0-beta.1` and double-fire.
#
# Optional repository secrets:
#   Tier 1 (Apple Developer ID + notarization):
#     CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Tier 2 (self-signed; generate via .github/scripts/gen-selfsign-cert.sh):
#     SCVN_SELFSIGN_P12 (base64 .p12), SCVN_SELFSIGN_PASSWORD
# GITHUB_TOKEN (auto) publishes the release; contents:write is granted below.

name: release-stable

on:
  push:
    tags:
      - "v*"
      - "!v*-*" # exclude semver prerelease tags (handled by release-beta.yml)

# Supersede in-flight runs for the same tag.
concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64), matches the shipped target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ($pkg). Bump the version to match the tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # electron-builder runs parallel GitHub uploaders; if the release does not
      # yet exist they race and each creates a separate draft, splitting assets
      # across duplicates. Pre-creating one draft makes every uploader attach to
      # it. Idempotent: re-runs reuse the existing release for this tag.
      - name: Ensure a single draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated release $GITHUB_REF_NAME."

      - name: Build, sign, and publish
        env:
          # Generic build-time tab selection: ship the full tab set.
          SCVN_TABS: fork,git,init,settings
          # Tier 1 — Apple Developer ID (empty string when the secret is unset).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tier 2 — self-signed cert.
          SCVN_SELFSIGN_P12: ${{ secrets.SCVN_SELFSIGN_P12 }}
          SCVN_SELFSIGN_PASSWORD: ${{ secrets.SCVN_SELFSIGN_PASSWORD }}
          # Publish manual-install downloads to this repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tiered signing (Developer ID -> self-signed -> ad-hoc).
        run: bash .github/scripts/build-sign-publish.sh stable

      # Publish only after all manual-install assets have uploaded successfully.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
