# BETA release. A semver PRERELEASE tag `v<version>` where <version> carries a
# prerelease id (e.g. v0.6.0-beta.1) builds the macOS app (same tab set as
# stable) and publishes it to GitHub Releases as a
# PRE-RELEASE for internal testers.
#
# Why semver prerelease and not a `b` suffix: electron-builder derives the
# GitHub release tag from package.json `version` (v${version}), NOT from the git
# tag. So the git tag MUST equal v${version}, and ${version} must be valid
# semver. `0.5.0b` is invalid semver and would misfile assets under a stray
# `v0.5.0` draft; `0.6.0-beta.1` derives the matching `v0.6.0-beta.1` tag.
#
# Release routing follows tags, not branch pushes:
#   - v<version> with a prerelease id (v*-*) → this workflow    (beta)
#   - v<version> release (no prerelease id)  → release-stable.yml (stable)
#
# Signing is tiered: Apple Developer ID, self-signed cert, then ad-hoc fallback.
# Installed apps can opt into this channel in Settings > Updates.
name: release-beta

on:
  push:
    tags:
      - "v*-*" # semver prerelease tags only, e.g. v0.6.0-beta.1

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  beta:
    runs-on: macos-14 # electron-builder --mac must run on macOS
    env:
      # Ship the same tab set as stable (generic build-time tab selection).
      SCVN_TABS: fork,git,init,settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag == v${version} and version is a semver prerelease
        run: |
          ver="$(node -p "require('./package.json').version")"
          expected="v${ver}"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Beta tag ${GITHUB_REF_NAME} must equal v<version> ($expected). electron-builder publishes to v\${version}; bump package.json to the beta version first."
            exit 1
          fi
          case "$ver" in
            *-*) : ;; # has a prerelease id (e.g. 0.6.0-beta.1) — good
            *) echo "::error::Beta requires a semver prerelease version (e.g. 0.6.0-beta.1); package.json is $ver. Use release-stable.yml for a plain release."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run typecheck
          npm run typecheck:desktop
          npm run build
          npm test

      - name: Prepare unpublished draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/tmp/release-is-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-is-draft)" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; refusing to replace assets"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --prerelease \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated beta $GITHUB_REF_NAME (macOS arm64). Install manually; first run may need right-click→Open."
          fi
      - name: Build, sign, and upload DMG/ZIP pre-release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SCVN_SELFSIGN_P12: ${{ secrets.SCVN_SELFSIGN_P12 }}
          SCVN_SELFSIGN_PASSWORD: ${{ secrets.SCVN_SELFSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-sign-publish.sh beta

      - name: Verify release asset allowlist and publish beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' "game-dev-forge-$(node -p "require('./package.json').version")-arm64.dmg" "game-dev-forge-$(node -p "require('./package.json').version")-arm64.zip" | sort)"
          if [ "$assets" != "$expected" ]; then
            echo "::error::release contains files outside the DMG/ZIP allowlist"
            printf 'Expected:\n%s\nFound:\n%s\n' "$expected" "$assets"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
